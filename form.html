<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <h1 class="text-center mb-4">Contact Us</h1>
                <form action="" id="form1" method="post">
                    <div class="mb-3">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" id="name" name="MyName" class="form-control" placeholder="Enter Your Name">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="MyEmail" class="form-control"
                            placeholder="Enter Your Email">
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Messages</label>
                        <textarea name="message" id="Message" name="MyMessage" class="form-control"
                            placeholder="Enter Your Message"></textarea>

                        <div class="d-grid">
                            <input type="submit" value="Submit" class="btn btn-primary">
                        </div>


                </form>
            </div>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.22.1/jquery.validate.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#form1").validate({
                rules: {
                    MyName: {
                        required: true,
                        minlength: 3,
                        maxlength: 20,
                    },

                    MyEmail: {
                        required: true,
                        email: true,
                    },

                    MyMessage: {
                        required: true,
                        minlength: 30,
                    }
                },

                Message: {
                    MyName: {
                        required: "please enter name",
                        minlength: "enter atleast 3 characters",
                        maxlength: "name cant exceed 20 characters",
                    },

                    MyEmail: {
                        required: "enter your email",
                        email: "enter a valid email",
                    },

                    MyMessage: {
                        required: "please enter your message",
                        minlength: "please enter atleast 30 characters",
                    }
                },

                errorPlacement: function (error, element) {
                    error.insertBefore(element);
                },

                Highlight: function (element) {
                    $(element).addClass("invalid-check").removeClass("valid-check")
                },

                unHighlight: function (element) {
                    $(element).removeClass("invalid-check").addClass("valid-check")
                },

                submitHandler: function (form) {
                    alert("form submitted");
                    form.submit();
                }
            });
        });
    </script>


</body>

</html>
